[project]
name = "sameboy-mcp"
version = "0.1.0"
description = "MCP server for SameBoy Game Boy emulator integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "cffi>=1.15.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
sameboy-mcp = "sameboy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
